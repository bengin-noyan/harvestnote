<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!--
      viewport-fit=cover: telefon tarayıcılarında çentik/jest çubuğu
      alanlarının env(safe-area-inset-*) ile okunabilmesi için gerekli.
      maximum-scale bilerek verilmiyor — yakınlaştırmayı engellemek
      erişilebilirliği kırar. iOS Safari'nin odaklanınca yakınlaştırma
      davranışı, metin kutularının 16px'ten küçük olmamasıyla zaten
      önleniyor (bkz. typography.bodyLarge).
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#faf8f5" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta
      name="description"
      content="HarvestNote — her notun bir tohum olduğu, çevrimdışı çalışan görev bahçesi."
    />
    <title>HarvestNote</title>

    <!-- react-native-web'in önerdiği stil sıfırlaması. -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      body {
        overflow: hidden;
        /*
          Mobil tarayıcıda lastik bant kaydırması ve aşağı çekip yenileme
          jesti uygulamanın kendi kaydırmasıyla çakışıyordu.
        */
        overscroll-behavior: none;
        -webkit-tap-highlight-color: transparent;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      HarvestNote'u kullanmak için tarayıcınızda JavaScript'i etkinleştirin.
    </noscript>
    <div id="root"></div>
  </body>
</html>
